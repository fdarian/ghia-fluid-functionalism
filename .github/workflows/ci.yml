name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The native addon is darwin-arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { cache: "true" }
      - run: pnpm --filter ghia-fluid-functionalism-demo check:single-instance
